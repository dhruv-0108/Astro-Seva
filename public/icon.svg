<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Crimson Maroon Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#9E2A2B" />
      <stop offset="60%" stop-color="#7A1C28" />
      <stop offset="100%" stop-color="#4A0E17" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Outer Gold Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    
    <!-- Soft Gold Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.35" />
  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#ringGrad)" stroke-width="7" opacity="0.75" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="8 8" opacity="0.5" />

  <!-- Sun Rays & Astrological Axis -->
  <g opacity="0.2" stroke="url(#goldGrad)" stroke-width="2">
    <line x1="256" y1="20" x2="256" y2="492" />
    <line x1="20" y1="256" x2="492" y2="256" />
    <line x1="89" y1="89" x2="423" y2="423" />
    <line x1="89" y1="423" x2="423" y2="89" />
  </g>

  <!-- Sacred Om (🕉) Symbol -->
  <g filter="url(#glow)">
    <text x="256" y="328" font-family="'Noto Sans', 'Segoe UI', Arial, sans-serif" font-size="250" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">🕉</text>
  </g>

  <!-- Sacred Tilak Dots -->
  <circle cx="256" cy="64" r="7" fill="url(#goldGrad)" />
  <circle cx="256" cy="448" r="7" fill="url(#goldGrad)" />
  <circle cx="64" cy="256" r="7" fill="url(#goldGrad)" />
  <circle cx="448" cy="256" r="7" fill="url(#goldGrad)" />
</svg>
